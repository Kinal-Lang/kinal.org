        function escapeHtml(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
        function formatDate(iso){try{var d=new Date(iso);return d.toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric"})}catch(e){return iso}}
        function formatSize(bytes){if(bytes<1024)return bytes+" B";if(bytes<1048576)return (bytes/1024).toFixed(1)+" KB";return (bytes/1048576).toFixed(1)+" MB"}
        function platformIcon(name){var n=name.toLowerCase();if(n.indexOf("linux")>=0)return "🐧";if(n.indexOf("win")>=0)return "🪟";if(n.indexOf("mac")>=0||n.indexOf("darwin")>=0)return "🍎";if(n.indexOf("sha256")>=0)return "🔒";return "📦"}
        function simpleMarkdown(md){if(!md)return "";var lines=md.split("\n");var html="";var inList=false;for(var i=0;i<lines.length;i++){var line=lines[i];if(/^###\s/.test(line)){if(inList){html+="</ul>";inList=false}html+="<h4>"+escapeHtml(line.replace(/^###\s/,""))+"</h4>"}else if(/^##\s/.test(line)){if(inList){html+="</ul>";inList=false}html+="<h3>"+escapeHtml(line.replace(/^##\s/,""))+"</h3>"}else if(/^[-*]\s/.test(line)){if(!inList){html+="<ul>";inList=true}html+="<li>"+escapeHtml(line.replace(/^[-*]\s/,""))+"</li>"}else if(line.trim()===""){if(inList){html+="</ul>";inList=false}}else{if(inList){html+="</ul>";inList=false}html+="<p>"+escapeHtml(line)+"</p>"}}if(inList)html+="</ul>";return html}
