    <script src="https://cdn.jsdelivr.net/npm/marked@13/marked.min.js"></script>

    <script src="/static/kinal-highlight.js"></script>
    <script>
    (function(){
        var toggle = document.getElementById("topbar-toggle");
        var topbar = document.querySelector(".topbar");
        if (toggle && topbar) {
            toggle.addEventListener("click", function(){ topbar.classList.toggle("menu-open"); });
        }

        var localeSwitch = document.getElementById("locale-switch");
        var localeTrigger = document.getElementById("locale-trigger");
        if (localeSwitch && localeTrigger) {
            localeTrigger.addEventListener("click", function(e){
                e.stopPropagation();
                localeSwitch.classList.toggle("open");
            });
            document.addEventListener("click", function(){ localeSwitch.classList.remove("open"); });
        }

        marked.setOptions({
            gfm: true,
            breaks: false,
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try { return hljs.highlight(code, { language: lang }).value; } catch (e) {}
                }
                try { return hljs.highlightAuto(code).value; } catch (e) { return code; }
            }
        });

        var container = document.getElementById("releases-container");
        var loading = document.getElementById("releases-loading");

        function escapeHtml(text) {
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function escapeAttr(text) {
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/"/g, "&quot;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        function formatDate(iso) {
            try {
                var d = new Date(iso);
                return d.toLocaleDateString("zh-CN", { year: "numeric", month: "long", day: "numeric" });
            } catch (e) {
                return iso;
            }
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + " B";
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
            return (bytes / 1048576).toFixed(1) + " MB";
        }

        function platformIconPath(name) {
            var lower = name.toLowerCase();
            if (lower.indexOf("sha256") >= 0 || lower.indexOf("checksum") >= 0 || /\.txt$/i.test(lower)) return "/static/download-icons/lock.png";
            if (lower.indexOf("linux") >= 0) return "/static/download-icons/linux.png";
            if (lower.indexOf("win") >= 0 || lower.indexOf("windows") >= 0) return "/static/download-icons/windows.png";
            if (lower.indexOf("mac") >= 0 || lower.indexOf("darwin") >= 0) return "/static/download-icons/apple.png";
            return "/static/download-icons/lock.png";
        }

        function platformIconAlt(name) {
            var lower = name.toLowerCase();
            if (lower.indexOf("sha256") >= 0 || lower.indexOf("checksum") >= 0 || /\.txt$/i.test(lower)) return "校验文件";
            if (lower.indexOf("linux") >= 0) return "Linux";
            if (lower.indexOf("win") >= 0 || lower.indexOf("windows") >= 0) return "Windows";
            if (lower.indexOf("mac") >= 0 || lower.indexOf("darwin") >= 0) return "macOS";
            return "下载文件";
        }

        function enhanceCodeBlocks(scope, copyLabel, copiedLabel) {
            var pres = scope.querySelectorAll("pre");
            for (var i = 0; i < pres.length; i++) {
                var pre = pres[i];
                if (pre.parentNode && pre.parentNode.classList && pre.parentNode.classList.contains("code-block-wrapper")) continue;

                var codeEl = pre.querySelector("code");
                if (!codeEl) continue;

                codeEl.innerHTML = codeEl.innerHTML.replace(/^\s*\n/, "");

                var langMatch = codeEl.className.match(/language-([a-zA-Z0-9_-]+)/);
                var langText = langMatch ? langMatch[1] : "text";

                var wrapper = document.createElement("div");
                wrapper.className = "code-block-wrapper";

                var header = document.createElement("div");
                header.className = "code-block-header";

                var langSpan = document.createElement("span");
                langSpan.className = "code-block-lang";
                langSpan.textContent = langText === "kinal" ? "Kinal" : langText;

                var copyBtn = document.createElement("button");
                copyBtn.className = "code-block-copy";
                copyBtn.type = "button";
                copyBtn.textContent = copyLabel;
                (function(textToCopy, button){
                    button.onclick = function() {
                        navigator.clipboard.writeText(textToCopy).then(function(){
                            var oldText = button.textContent;
                            button.textContent = copiedLabel;
                            setTimeout(function(){ button.textContent = oldText; }, 2000);
                        });
                    };
                })(codeEl.textContent, copyBtn);

                header.appendChild(langSpan);
                header.appendChild(copyBtn);
                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(header);
                wrapper.appendChild(pre);

                if (langText === "kinal" || langText === "kn") {
                    if (window.highlightKinal) {
                        codeEl.innerHTML = window.highlightKinal(codeEl.textContent);
                        codeEl.classList.add("hljs");
                        codeEl.style.backgroundColor = "transparent";
                        codeEl.parentElement.style.backgroundColor = "transparent";
                    }
                } else if (!codeEl.classList.contains("hljs") && window.hljs) {
                    hljs.highlightElement(codeEl);
                    if (langText === "bash" || langText === "sh") {
                        codeEl.innerHTML = codeEl.innerHTML
                            .replace(/\b(kinal)\b/g, '<span class="token-namespace">$1</span>')
                            .replace(/\b(build|run|fmt|test|new|pkg)\b/g, '<span class="token-funcname">$1</span>')
                            .replace(/(\s-[a-zA-Z0-9-]+)(\s|$)/g, '<span class="token-number">$1</span>$2');
                    }
                }
            }

            var links = scope.querySelectorAll("a");
            for (var j = 0; j < links.length; j++) {
                var href = links[j].getAttribute("href");
                if (href && /^https?:\/\//i.test(href)) {
                    links[j].setAttribute("target", "_blank");
                    links[j].setAttribute("rel", "noopener noreferrer");
                }
            }
        }

        function renderMarkdownInto(target, markdown, copyLabel, copiedLabel) {
            if (!target) return;
            if (window.marked) {
                target.innerHTML = marked.parse(markdown || "");
            } else {
                target.textContent = markdown || "";
            }
            enhanceCodeBlocks(target, copyLabel, copiedLabel);
        }

        function renderReleases(data) {
            loading.style.display = "none";
            var releases = data.releases || [];
            if (releases.length === 0) {
                container.innerHTML = '<div class="releases-empty"><p>暂无可用的发行版，请稍后再来查看！</p></div>';
                return;
            }

            var html = "";
            for (var i = 0; i < releases.length; i++) {
                var rel = releases[i];
                var isLatest = i === 0;
                html += '<div class="release-card' + (isLatest ? " release-latest" : "") + '" id="release-' + escapeHtml(rel.tag_name) + '">';
                html += '<div class="release-header">';
                html += '<div class="release-title-row">';
                html += '<h2>' + escapeHtml(rel.name || rel.tag_name) + '</h2>';
                if (isLatest) html += '<span class="release-badge">最新</span>';
                if (rel.prerelease) html += '<span class="release-badge release-badge-pre">预发行</span>';
                html += '</div>';
                html += '<div class="release-meta">';
                html += '<span class="release-tag">' + escapeHtml(rel.tag_name) + '</span>';
                html += '<span class="release-date">' + formatDate(rel.published_at) + '</span>';
                if (rel.html_url) html += '<a class="release-gh-link" href="' + escapeAttr(rel.html_url) + '" target="_blank" rel="noopener noreferrer">在 GitHub 查看 →</a>';
                html += '</div>';
                html += '</div>';

                if (rel.body_markdown) {
                    html += '<div class="release-body docs-rendered" id="release-body-' + i + '"></div>';
                }

                var assets = rel.assets || [];
                if (assets.length > 0) {
                    html += '<div class="release-assets">';
                    html += '<h3>下载</h3>';
                    html += '<div class="asset-list">';
                    for (var j = 0; j < assets.length; j++) {
                        var asset = assets[j];
                        html += '<div class="asset-item">';
                        html += '<span class="asset-icon"><img class="asset-icon-image" src="' + escapeAttr(platformIconPath(asset.name)) + '" alt="' + escapeAttr(platformIconAlt(asset.name)) + '"></span>';
                        html += '<span class="asset-info">';
                        html += '<span class="asset-name">' + escapeHtml(asset.name) + '</span>';
                        html += '<span class="asset-size">' + formatSize(asset.size_bytes) + '</span>';
                        html += '</span>';
                        html += '<a class="asset-download-btn" href="' + escapeAttr(asset.download_url) + '" download>下载</a>';
                        html += '</div>';
                    }
                    html += '</div>';
                    html += '</div>';
                }

                html += '</div>';
            }

            container.innerHTML = html;

            for (var k = 0; k < releases.length; k++) {
                if (releases[k].body_markdown) {
                    renderMarkdownInto(document.getElementById("release-body-" + k), releases[k].body_markdown, "复制", "已复制");
                }
            }
        }

        fetch("/static/data/releases.json", { cache: "no-store" })
            .then(function(r){
                if (!r.ok) throw new Error("HTTP " + r.status);
                return r.json();
            })
            .then(renderReleases)
            .catch(function(){
                loading.style.display = "none";
                container.innerHTML = '<div class="releases-empty"><p>无法加载发行版数据。请直接访问 <a href="https://github.com/Kinal-Lang/Kinal/releases" target="_blank" rel="noopener noreferrer">GitHub Releases</a>。</p></div>';
            });
    })();
    </script>
